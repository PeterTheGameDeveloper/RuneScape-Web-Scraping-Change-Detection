version: 2

models:
  - name: stg_wiki_changes
    description: Cleaned and standardized wiki change events
    columns:
      - name: change_id
        description: Unique change identifier
        tests:
          - unique
          - not_null
      - name: revid
        description: Wiki revision ID
        tests:
          - not_null
      - name: change_timestamp
        description: When the change occurred (UTC)
        tests:
          - not_null
      - name: title
        description: Wiki page title
        tests:
          - not_null
      - name: editor_name
        description: Username who made the edit
      - name: edit_type
        description: 'Type of edit: addition, removal, or no_change'
        tests:
          - accepted_values:
              values: ['addition', 'removal', 'no_change']
