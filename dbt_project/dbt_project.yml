name: 'osrs_wiki_pipeline'
version: '1.0.0'
config-version: 2

profile: 'osrs_wiki'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Default lookback for incremental models
  lookback_hours: 24

models:
  osrs_wiki_pipeline:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
